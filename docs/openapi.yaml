openapi: 3.1.0
info:
  title: bankagent API
  version: 0.2.0
  description: |
    银行 AI 智能体公开 HTTP API。所有业务操作运行在本地演示账本上。
    LLM 只产生结构化意图和候选计划；授权、风险、动作状态和业务结果由 Go 服务端决定。
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Conversations
    description: 会话创建与自然语言消息。
  - name: Actions
    description: 动作创建、确认、MFA、取消和预约触发。
  - name: Queries
    description: 账户、账单、理财、卡片、订阅、流动性与工作流查询。
  - name: Audit
    description: 脱敏决策与执行审计链。
paths:
  /v1/conversations:
    post:
      tags: [Conversations]
      summary: 创建会话
      operationId: createConversation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: 会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeConversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/conversations/{conversation_id}/messages:
    post:
      tags: [Conversations]
      summary: 提交自然语言消息
      description: 返回追问、只读查询结果或待授权动作。服务端可使用当前会话 30 分钟内最近 6 条用户消息补全省略表达；不会直接接受模型返回的授权结论。
      operationId: createConversationMessage
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: 消息已处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeMessageResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/actions/{action_id}:
    get:
      tags: [Actions]
      summary: 查询动作
      operationId: getAction
      parameters:
        - $ref: '#/components/parameters/ActionID'
      responses:
        '200':
          description: 动作详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/actions/{action_id}/confirm:
    post:
      tags: [Actions]
      summary: 确认黄色动作
      description: 服务端复核不可变动作快照、授权状态、过期时间和幂等键后执行或推进动作。
      operationId: confirmAction
      parameters:
        - $ref: '#/components/parameters/ActionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionRequest'
      responses:
        '200':
          description: 动作已确认或已返回幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/actions/{action_id}/mfa/verify:
    post:
      tags: [Actions]
      summary: 验证红色动作 MFA
      description: MFA 成功只推进动作到执行门；业务成功仍必须来自工具回执。
      operationId: verifyActionMFA
      parameters:
        - $ref: '#/components/parameters/ActionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMFARequest'
      responses:
        '200':
          description: MFA 已验证或已返回幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/actions/{action_id}/cancel:
    post:
      tags: [Actions]
      summary: 取消动作
      operationId: cancelAction
      parameters:
        - $ref: '#/components/parameters/ActionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 动作已取消或已返回幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/actions/{action_id}/trigger:
    post:
      tags: [Actions]
      summary: 触发已到预约时间的动作
      description: 仅允许 scheduled 状态且已到达 scheduled_at 的预约动作。红色动作先返回 awaiting_mfa，重新验证后才执行。
      operationId: triggerScheduledAction
      parameters:
        - $ref: '#/components/parameters/ActionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 预约动作已执行或已返回幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/transfers:
    post:
      tags: [Actions]
      summary: 创建转账动作
      operationId: createTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201':
          description: 转账动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/transfer-splits:
    post:
      tags: [Actions]
      summary: 创建 AA 拆分收款请求动作
      description: 服务端重新计算每人份额；执行只登记收款请求，不替其他参与人扣款。
      operationId: createTransferSplit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSplitRequest'
      responses:
        '201':
          description: AA 收款动作已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/liquidity-simulations:
    post:
      tags: [Queries]
      summary: 创建流动性预检
      description: 确定性计算未来现金流和逐日可用余额，不扣款、不创建动作。
      operationId: createLiquiditySimulation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiquiditySimulationRequest'
      responses:
        '201':
          description: 流动性预检已生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeLiquiditySimulation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/liquidity-simulations/{simulation_id}:
    get:
      tags: [Queries]
      summary: 查询流动性预检
      operationId: getLiquiditySimulation
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: 流动性预检结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeLiquiditySimulation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/investments/products/{product_id}/subscriptions:
    post:
      tags: [Actions]
      summary: 创建理财申购动作
      operationId: subscribeInvestment
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentOrderRequest'
      responses:
        '201':
          description: 申购动作已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/investments/holdings/{holding_id}/redemptions:
    post:
      tags: [Actions]
      summary: 创建理财赎回动作
      operationId: redeemInvestment
      parameters:
        - name: holding_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentRedemptionRequest'
      responses:
        '201':
          description: 赎回动作已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/cards/{card_id}/apply:
    post:
      tags: [Actions]
      summary: 创建虚拟卡申请动作
      operationId: applyCard
      parameters:
        - name: card_id
          in: path
          required: true
          description: 申请类型，例如 virtual
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardApplicationRequest' }
      responses:
        '201':
          description: 卡片申请动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/cards/{card_id}/limit:
    post:
      tags: [Actions]
      summary: 创建卡片额度调整动作
      operationId: updateCardLimit
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardLimitRequest' }
      responses:
        '201':
          description: 额度调整动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/cards/{card_id}/freeze:
    post:
      tags: [Actions]
      summary: 创建卡片冻结动作
      operationId: freezeCard
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardApplicationRequest' }
      responses:
        '201':
          description: 卡片冻结动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/cards/{card_id}/unfreeze:
    post:
      tags: [Actions]
      summary: 创建卡片解冻动作
      operationId: unfreezeCard
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardApplicationRequest' }
      responses:
        '201':
          description: 卡片解冻动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/cards/{card_id}/lost:
    post:
      tags: [Actions]
      summary: 创建卡片挂失动作
      description: 卡片挂失属于红色动作，必须完成动作绑定的 MFA。
      operationId: reportCardLost
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardApplicationRequest' }
      responses:
        '201':
          description: 卡片挂失动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/cards/{card_id}/unlost:
    post:
      tags: [Actions]
      summary: 创建卡片解挂动作
      description: 从 lost 恢复 active 属于红色动作，必须完成动作绑定的 MFA。
      operationId: clearCardLostStatus
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardApplicationRequest' }
      responses:
        '201':
          description: 卡片解挂动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/subscriptions/{subscription_id}/cancel:
    post:
      tags: [Actions]
      summary: 创建订阅取消动作
      operationId: cancelSubscription
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardApplicationRequest' }
      responses:
        '201':
          description: 订阅取消动作已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '423': { $ref: '#/components/responses/Locked' }
  /v1/accounts/{account_id}/balance:
    get:
      tags: [Queries]
      summary: 查询账户余额
      operationId: getAccountBalance
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: 账户余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{account_id}/transactions:
    get:
      tags: [Queries]
      summary: 查询账户交易
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 交易列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{account_id}/bills/summary:
    get:
      tags: [Queries]
      summary: 查询账单汇总
      operationId: getBillSummary
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - in: query
          name: month
          required: false
          description: 账单月份；与 year 互斥，省略时使用 Asia/Shanghai 当前自然月。
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$', example: '2026-10' }
        - in: query
          name: year
          required: false
          description: 年度账单；设置后优先按自然年统计。
          schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 }
      responses:
        '200':
          description: 账单分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeBillSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/investments/products:
    get:
      tags: [Queries]
      summary: 查询理财产品
      operationId: listInvestmentProducts
      parameters:
        - in: query
          name: risk_level
          schema:
            type: string
            enum: [conservative, balanced, aggressive]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 理财产品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/investments/holdings:
    get:
      tags: [Queries]
      summary: 查询理财持仓
      operationId: listInvestmentHoldings
      responses:
        '200':
          description: 理财持仓列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeHoldingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cards:
    get:
      tags: [Queries]
      summary: 查询卡片
      operationId: listCards
      responses:
        '200':
          description: 卡片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCardList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/subscriptions:
    get:
      tags: [Queries]
      summary: 查询订阅
      operationId: listSubscriptions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, cancelled, paused]
      responses:
        '200':
          description: 订阅列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSubscriptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/subscriptions/reminders:
    get:
      tags: [Queries]
      summary: 查询即将续费的订阅
      operationId: listSubscriptionReminders
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 0, maximum: 365, default: 7 }
      responses:
        '200':
          description: 续费提醒列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSubscriptionReminderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workflows:
    post:
      tags: [Actions]
      summary: 创建跨场景工作流
      operationId: createWorkflow
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: 工作流已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWorkflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          $ref: '#/components/responses/Locked'
    get:
      tags: [Queries]
      summary: 查询工作流列表
      operationId: listWorkflows
      responses:
        '200':
          description: 工作流列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWorkflowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workflows/{workflow_id}:
    get:
      tags: [Queries]
      summary: 查询工作流
      operationId: getWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      responses:
        '200':
          description: 工作流详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWorkflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workflows/{workflow_id}/cancel:
    post:
      tags: [Actions]
      summary: 取消工作流未执行节点
      operationId: cancelWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 工作流已取消或已返回幂等结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWorkflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/workflows/{workflow_id}/advance:
    post:
      tags: [Actions]
      summary: 推进一个当前可执行的工作流节点
      operationId: advanceWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                virtual_now:
                  type: string
                  format: date-time
                  description: 仅用于受控演示；只有 due_at 不晚于该时间的 ready 节点才会推进。
      responses:
        '200':
          description: 节点已自动完成或已生成待授权动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWorkflowAdvance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /v1/audit-traces/{trace_id}:
    get:
      tags: [Audit]
      summary: 查询脱敏审计链
      operationId: getAuditTrace
      parameters:
        - $ref: '#/components/parameters/TraceID'
      responses:
        '200':
          description: 审计链
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAuditTrace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: demo-token
  parameters:
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ActionID:
      name: action_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AccountID:
      name: account_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    WorkflowID:
      name: workflow_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    TraceID:
      name: trace_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一用户、路径和请求体只能使用一次；重试必须复用原键。响应头 `X-Idempotency-Status` 为 `stored`、`replayed`、`pending` 或 `degraded`。
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    BadRequest:
      description: 请求格式或参数错误
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: 未认证
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: 无权访问资源
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: 资源不存在或不可见
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: 状态冲突、重复执行或资源版本冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    IdempotencyConflict:
      description: 幂等键已用于不同请求体，或相同键的请求仍在处理中
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Expired:
      description: 动作已过期
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: 业务字段或计划校验失败
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: 请求或验证频率受限
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Locked:
      description: 当前动作 MFA 尝试耗尽，或用户连续异常操作触发安全锁定
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BadGateway:
      description: 受控业务工具明确拒绝或执行失败
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: 服务暂时不可用或执行结果需要对账
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InternalError:
      description: 内部错误
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Envelope:
      type: object
      required: [trace_id, data]
      properties:
        trace_id: { type: string }
        data: {}
    ErrorEnvelope:
      type: object
      required: [trace_id, error]
      properties:
        trace_id: { type: string }
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - PERMISSION_DENIED
            - NOT_FOUND
            - ACTION_STATE_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - IDEMPOTENCY_IN_PROGRESS
            - IDEMPOTENCY_UNAVAILABLE
            - ACTION_EXPIRED
            - MFA_INVALID
            - MFA_LOCKED
            - SECURITY_LOCKED
            - INSUFFICIENT_BALANCE
            - BUDGET_NOT_RESERVED
            - TOOL_REJECTED
            - TOOL_FAILED
            - PLAN_REJECTED
            - RATE_LIMITED
            - INTERNAL
            - SERVICE_UNAVAILABLE
            - EXECUTION_UNKNOWN
        message: { type: string }
        details: { type: object, additionalProperties: true }
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties: {}
    Conversation:
      type: object
      required: [conversation_id, created_at]
      properties:
        conversation_id: { type: string }
        created_at: { type: string, format: date-time }
    CreateMessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
    MessageResult:
      type: object
      required: [run_id, reply_type]
      properties:
        run_id: { type: string }
        reply_type:
          type: string
          enum: [question, query_result, action_required, workflow_created, rejected]
        text: { type: string }
        action:
          $ref: '#/components/schemas/Action'
        balance:
          $ref: '#/components/schemas/Balance'
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        bill:
          $ref: '#/components/schemas/BillSummary'
        data:
          description: 受控查询结果，例如产品、卡片或订阅列表
        liquidity:
          $ref: '#/components/schemas/LiquiditySimulation'
        workflow:
          $ref: '#/components/schemas/Workflow'
    ConfirmActionRequest:
      type: object
      description: 用户确认动作快照；当前演示版本请求体为空对象即可。
      additionalProperties: false
    VerifyMFARequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 12, writeOnly: true }
    Action:
      type: object
      required: [action_id, trace_id, conversation_id, kind, risk_level, status, snapshot_hash, expires_at, created_at, updated_at]
      properties:
        action_id: { type: string }
        trace_id: { type: string, description: 动作全生命周期统一 Trace ID }
        conversation_id: { type: string }
        kind: { type: string }
        risk_level:
          type: string
          enum: [green, yellow, red]
        status:
          type: string
          enum: [awaiting_confirmation, awaiting_mfa, scheduled, executing, processing, reconciliation_required, succeeded, failed, cancelled, expired]
        snapshot: { type: object, additionalProperties: true, description: 服务端生成的不可变动作快照 }
        snapshot_hash: { type: string, description: 规范化快照的 SHA-256 哈希，授权和执行前必须复核 }
        result: { type: object, additionalProperties: true, description: 动作成功后的业务回执结果，例如理财赎回本金、收益和到账总额 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Balance:
      type: object
      required: [account_id, currency, balance_minor, reserved_minor, available_minor]
      properties:
        account_id: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        balance_minor: { type: integer, format: int64 }
        reserved_minor: { type: integer, format: int64, minimum: 0, description: 跨场景预算锁占用的金额 }
        available_minor: { type: integer, format: int64, minimum: 0, description: balance_minor 减去 reserved_minor }
    Transaction:
      type: object
      required: [transaction_id, direction, amount_minor, description, created_at]
      properties:
        transaction_id: { type: string }
        direction: { type: string, enum: [in, out] }
        amount_minor: { type: integer, format: int64 }
        category: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
    TransactionPage:
      type: object
      required: [items, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    BillSummary:
      type: object
      required: [month, total_minor, currency, categories]
      properties:
        month:
          type: string
          pattern: '^\\d{4}(-\\d{2})?$'
          description: 月度账单为 YYYY-MM，年度账单为 YYYY。
        period:
          type: string
          description: 年度报告期间；月度报告可省略。
        total_minor: { type: integer, format: int64 }
        currency: { type: string }
        transaction_count: { type: integer, format: int64 }
        categories:
          type: array
          items:
            type: object
            required: [category, amount_minor, count, share_bps]
            properties:
              category: { type: string }
              amount_minor: { type: integer, format: int64 }
              count: { type: integer, format: int64 }
              share_bps: { type: integer, format: int64 }
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/BillAnomaly'
    BillAnomaly:
      type: object
      required: [transaction_id, amount_minor, category, description, reason]
      properties:
        transaction_id: { type: string }
        amount_minor: { type: integer, format: int64 }
        category: { type: string }
        description: { type: string }
        reason: { type: string }
    Product:
      type: object
      required: [product_id, name, risk_level, minimum_amount_minor]
      properties:
        product_id: { type: string }
        name: { type: string }
        risk_level: { type: string, enum: [conservative, balanced, aggressive] }
        minimum_amount_minor: { type: integer, format: int64 }
        term_days: { type: integer, minimum: 0 }
        benchmark_note: { type: string }
        annual_rate_bps: { type: integer, format: int64, minimum: 0, description: 演示用年化基准，不构成收益承诺 }
    Holding:
      type: object
      required: [holding_id, product_id, product_name, amount_minor, status, purchased_at]
      properties:
        holding_id: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        amount_minor: { type: integer, format: int64 }
        status: { type: string, enum: [active, redeemed] }
        purchased_at: { type: string, format: date-time }
    Card:
      type: object
      required: [card_id, status, limit_minor]
      properties:
        card_id: { type: string }
        masked_number: { type: string }
        status: { type: string, enum: [active, frozen, lost, closed] }
        limit_minor: { type: integer, format: int64 }
        restrictions: { type: array, items: { type: string } }
    Subscription:
      type: object
      required: [subscription_id, merchant_ref, status, amount_minor, billing_cycle]
      properties:
        subscription_id: { type: string }
        merchant_ref: { type: string }
        status: { type: string, enum: [active, cancelled, paused] }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        billing_cycle: { type: string }
        next_charge_at: { type: string, format: date-time }
    SubscriptionReminder:
      type: object
      required: [subscription_id, merchant_ref, amount_minor, currency, next_charge_at, days_until]
      properties:
        subscription_id: { type: string }
        merchant_ref: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        next_charge_at: { type: string, format: date-time }
        days_until: { type: integer, minimum: 0 }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [conversation_id, beneficiary_name, amount_minor]
      properties:
        conversation_id: { type: string, minLength: 1 }
        beneficiary_name: { type: string, minLength: 1, maxLength: 100 }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        remark: { type: string, maxLength: 200 }
        scheduled_at:
          type: string
          format: date-time
          description: 可选；设置后授权成功先进入 scheduled，动作有效期延至 scheduled_at + 5 分钟，到达时间后调用 trigger。
    SplitParticipant:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, pattern: '^\\d{11}$' }
        is_payer: { type: boolean }
        amount_minor: { type: integer, format: int64, readOnly: true, description: 服务端计算并写入快照 }
      anyOf:
        - required: [name]
        - required: [phone]
    TransferSplitRequest:
      type: object
      additionalProperties: false
      required: [conversation_id, total_amount_minor, participants]
      description: participants 包含付款人本人和所有分摊人，且必须恰好一人标记 is_payer；服务端按整数最小货币单位重算份额，除不尽的余数按数组顺序每人均摊 1 分。
      properties:
        conversation_id: { type: string, minLength: 1 }
        total_amount_minor: { type: integer, format: int64, minimum: 1 }
        participants:
          type: array
          minItems: 2
          maxItems: 10
          items: { $ref: '#/components/schemas/SplitParticipant' }
    TransferSplit:
      type: object
      required: [transfer_split_id, conversation_id, total_amount_minor, collectible_minor, currency, participants, status, created_at]
      properties:
        transfer_split_id: { type: string }
        conversation_id: { type: string }
        total_amount_minor: { type: integer, format: int64 }
        collectible_minor: { type: integer, format: int64 }
        currency: { type: string }
        participants:
          type: array
          items: { $ref: '#/components/schemas/SplitParticipant' }
        status: { type: string, enum: [requested] }
        created_at: { type: string, format: date-time }
    CreateLiquiditySimulationRequest:
      type: object
      additionalProperties: false
      required: [account_id, proposed_budget_minor]
      properties:
        account_id: { type: string, minLength: 1 }
        horizon_days: { type: integer, minimum: 0, maximum: 366, default: 30, description: 0 表示使用默认 30 天。 }
        proposed_budget_minor: { type: integer, format: int64, minimum: 0 }
        essential_buffer_minor: { type: integer, format: int64, minimum: 0, description: 省略时默认 100000，即 1000.00 CNY }
    LiquidityTimelinePoint:
      type: object
      required: [date, available_minor]
      properties:
        date: { type: string, format: date }
        available_minor: { type: integer, format: int64 }
    LiquidityScenario:
      type: object
      required: [name, daily_discretionary_minor, ending_available_minor, minimum_available_minor, minimum_date, status, points]
      properties:
        name: { type: string, enum: [essential_only, expected, conservative, income_stress] }
        daily_discretionary_minor: { type: integer, format: int64, minimum: 0 }
        ending_available_minor: { type: integer, format: int64 }
        minimum_available_minor: { type: integer, format: int64 }
        minimum_date: { type: string, format: date }
        status: { type: string, enum: [safe, tight, unsafe] }
        points:
          type: array
          items: { $ref: '#/components/schemas/LiquidityTimelinePoint' }
    LiquidityEvent:
      type: object
      required: [date, kind, direction, description, amount_minor, essential]
      properties:
        date: { type: string, format: date }
        kind: { type: string }
        direction: { type: string, enum: [in, out] }
        description: { type: string }
        amount_minor: { type: integer, format: int64, minimum: 0 }
        essential: { type: boolean }
        source_id: { type: string }
    LiquidityReservation:
      type: object
      required: [date, amount_minor]
      properties:
        date: { type: string, format: date }
        amount_minor: { type: integer, format: int64, minimum: 0 }
    LiquidityAlternative:
      type: object
      required:
        - alternative_id
        - label
        - description
        - conditional
        - total_budget_minor
        - reservations
        - status
        - expected_minimum_available_minor
        - expected_minimum_date
        - conservative_minimum_available_minor
        - conservative_minimum_date
        - income_stress_minimum_available_minor
        - income_stress_minimum_date
        - expected_points
        - recommended
        - tradeoff
      properties:
        alternative_id: { type: string, enum: [current, buffer_preserving, after_income, split] }
        label: { type: string }
        description: { type: string }
        conditional: { type: boolean, description: 为 true 时依赖尚未确认入账的未来收入 }
        condition: { type: string, description: 条件方案的人工可读执行条件 }
        total_budget_minor: { type: integer, format: int64, minimum: 0 }
        reservations:
          type: array
          items: { $ref: '#/components/schemas/LiquidityReservation' }
        status: { type: string, enum: [safe, tight, unsafe] }
        expected_minimum_available_minor: { type: integer, format: int64 }
        expected_minimum_date: { type: string, format: date }
        conservative_minimum_available_minor: { type: integer, format: int64 }
        conservative_minimum_date: { type: string, format: date }
        income_stress_minimum_available_minor: { type: integer, format: int64 }
        income_stress_minimum_date: { type: string, format: date }
        expected_points:
          type: array
          items: { $ref: '#/components/schemas/LiquidityTimelinePoint' }
        recommended: { type: boolean }
        tradeoff: { type: string }
    LiquiditySimulation:
      type: object
      required:
        - simulation_id
        - account_id
        - trace_id
        - currency
        - start_at
        - horizon_days
        - starting_available_minor
        - proposed_budget_minor
        - essential_buffer_minor
        - historical_average_daily_minor
        - historical_conservative_daily_minor
        - maximum_safe_budget_minor
        - income_stress_minimum_available_minor
        - income_stress_minimum_date
        - income_stress_status
        - depends_on_unconfirmed_income
        - verdict
        - risk_reason
        - recommendation
        - assumptions
        - events
        - scenarios
        - alternatives
        - recommended_alternative_id
        - created_at
      properties:
        simulation_id: { type: string }
        account_id: { type: string }
        trace_id: { type: string }
        currency: { type: string }
        start_at: { type: string, format: date-time }
        horizon_days: { type: integer, minimum: 1, maximum: 366 }
        starting_available_minor: { type: integer, format: int64 }
        proposed_budget_minor: { type: integer, format: int64, minimum: 0 }
        essential_buffer_minor: { type: integer, format: int64, minimum: 0 }
        historical_average_daily_minor: { type: integer, format: int64, minimum: 0 }
        historical_conservative_daily_minor: { type: integer, format: int64, minimum: 0 }
        maximum_safe_budget_minor: { type: integer, format: int64, minimum: 0 }
        income_stress_minimum_available_minor: { type: integer, format: int64 }
        income_stress_minimum_date: { type: string, format: date }
        income_stress_status: { type: string, enum: [safe, tight, unsafe] }
        depends_on_unconfirmed_income: { type: boolean, description: 结果是否依赖尚未确认到账的收入 }
        verdict: { type: string, enum: [safe, tight, unsafe] }
        risk_reason: { type: string }
        recommendation: { type: string }
        assumptions: { type: array, items: { type: string } }
        events:
          type: array
          items: { $ref: '#/components/schemas/LiquidityEvent' }
        scenarios:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/LiquidityScenario' }
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/LiquidityAlternative' }
        recommended_alternative_id: { type: string }
        created_at: { type: string, format: date-time }
    CardApplicationRequest:
      type: object
      additionalProperties: false
      required: [conversation_id]
      properties:
        conversation_id: { type: string, minLength: 1 }
    InvestmentOrderRequest:
      type: object
      additionalProperties: false
      required: [conversation_id, amount_minor, risk_acknowledged]
      properties:
        conversation_id: { type: string, minLength: 1 }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        risk_acknowledged: { type: boolean, enum: [true], description: 红色理财动作必须明确确认风险提示 }
    InvestmentRedemptionRequest:
      type: object
      additionalProperties: false
      required: [conversation_id]
      properties:
        conversation_id: { type: string, minLength: 1 }
    CardLimitRequest:
      type: object
      additionalProperties: false
      required: [conversation_id, limit_minor]
      properties:
        conversation_id: { type: string, minLength: 1 }
        limit_minor: { type: integer, format: int64, minimum: 0 }
    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [purpose, deadline, nodes]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 200 }
        deadline: { type: string, format: date-time, description: 当前时间起最长 366 天；预算预检会覆盖当前日至截止日的完整现金流 }
        nodes:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/WorkflowNodeInput'
    WorkflowNodeInput:
      type: object
      required: [node_id, kind]
      properties:
        node_id: { type: string }
        kind: { type: string, enum: [budget_lock, reminder, external_order] }
        depends_on: { type: array, items: { type: string } }
        amount_minor: { type: integer, format: int64, minimum: 0, description: 外部订单不超过 1000.00 CNY 为黄色确认，超过则为红色 MFA }
        merchant: { type: string }
        due_at:
          type: string
          format: date-time
          description: 节点最早可推进时间；省略时取创建时间。
    Workflow:
      type: object
      required: [workflow_id, status, nodes]
      properties:
        workflow_id: { type: string }
        status: { type: string, enum: [pending, running, partially_completed, completed, failed, cancelled] }
        purpose: { type: string }
        deadline: { type: string, format: date-time }
        nodes: { type: array, items: { $ref: '#/components/schemas/WorkflowNode' } }
    WorkflowNode:
      type: object
      required: [node_id, kind, status]
      properties:
        node_id: { type: string }
        kind: { type: string, enum: [budget_lock, reminder, external_order] }
        depends_on: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, ready, awaiting_authorization, running, succeeded, failed, skipped] }
        action_id: { type: string }
        amount_minor: { type: integer, format: int64, minimum: 0 }
        merchant: { type: string }
        due_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [event_id, trace_id, event_type, outcome, occurred_at, sequence]
      properties:
        event_id: { type: string }
        trace_id: { type: string }
        run_id: { type: string }
        action_id: { type: string }
        event_type: { type: string }
        outcome: { type: string }
        actor: { type: string, enum: [user, system, model, tool] }
        policy_version: { type: string }
        detail: { type: object, additionalProperties: true, description: 已脱敏的摘要，不包含验证码、Token 或完整账户号；按 sequence 排序 }
        occurred_at: { type: string, format: date-time }
        sequence: { type: integer, format: int64, minimum: 1 }
    AuditTrace:
